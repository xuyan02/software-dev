services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: foundry
      POSTGRES_PASSWORD: foundry
      POSTGRES_DB: foundry
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foundry"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: foundry
      MINIO_ROOT_PASSWORD: foundry123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  opa:
    image: openpolicyagent/opa:latest
    command: run --server --addr :8181
    ports:
      - "8181:8181"

volumes:
  pgdata:
  miniodata:
