[package]
name = "design-space"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "A git-like, versioned design space for code elements"

[lib]
name = "design_space"
path = "src/lib.rs"

[[bin]]
name = "ds"
path = "src/main.rs"

[dependencies]
axum = { workspace = true }
clap = { workspace = true }
libc = "0.2"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
tree-sitter = "0.27"
tree-sitter-cpp = "0.23"
tree-sitter-go = "0.25"
tree-sitter-java = "0.23"
tree-sitter-python = "0.25"
tokio = { workspace = true }
tree-sitter-rust = "0.24"
ureq = { version = "2", features = ["json"] }

[dev-dependencies]
tempfile = "3"
