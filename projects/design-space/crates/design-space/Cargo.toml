[package]
name = "design-space"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "A git-like, versioned design space"

[lib]
name = "design_space"
path = "src/lib.rs"

[[bin]]
name = "ds"
path = "src/main.rs"

[[bin]]
name = "ds-server"
path = "src/bin/ds_server.rs"

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true }
clap = { workspace = true }
reqwest = { workspace = true, features = ["blocking"] }
serde = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
tempfile = "3"
