[package]
name = "design-space"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "A git-like, versioned design space for code elements"

[lib]
name = "design_space"
path = "src/lib.rs"

[[bin]]
name = "ds"
path = "src/main.rs"

[[bin]]
name = "ds-server"
path = "src/server_main.rs"

[dependencies]
axum = { workspace = true }
clap = { workspace = true }
libc = "0.2"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true }
ureq = { version = "2", features = ["json"] }

[dev-dependencies]
tempfile = "3"
